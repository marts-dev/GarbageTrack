[project]
name = "garbagetrack"
version = "0.1.0"
description = "GarbageTrack — Meta Hackathon 2026 project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "pyjwt>=2.0",
    "pymongo>=4.10",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pillow>=10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# scikit-learn is required by osmnx nearest-node search on unprojected graphs.
routing = ["osmnx>=2,<3", "scikit-learn>=1.5,<2"]

# Garbage image classifier (MobileNetV3; CPU-friendly). Pillow decodes
# uploads; torch/torchvision serve and train the model.
ai = ["pillow>=10", "torch>=2.2", "torchvision>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
